services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cec_pg
    environment:
      POSTGRES_USER: cec
      POSTGRES_PASSWORD: cec
      POSTGRES_DB: cec
    ports:
      - "5432:5432"
    volumes:
      - cec_pgdata:/var/lib/postgresql/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.2
    container_name: cec_mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - cec_mlflow:/mlflow

volumes:
  cec_pgdata:
  cec_mlflow:
